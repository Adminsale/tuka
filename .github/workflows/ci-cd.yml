name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sre-app

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 app/app.py --max-line-length=120

      - name: Unit tests
        run: pytest app/test_app.py -v

  # ── 2. Build & Push ──────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Substitute image tag in deployment manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/deployment.yml
          echo "Deploying image: ${IMAGE}"

      - name: Apply Kubernetes manifests
        run: |
          # Requires KUBE_CONFIG secret with base64-encoded kubeconfig
          # echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          # export KUBECONFIG=/tmp/kubeconfig
          # kubectl apply -f k8s/namespace.yml
          # kubectl apply -f k8s/deployment.yml
          # kubectl apply -f k8s/service.yml
          # kubectl apply -f k8s/hpa.yml
          # kubectl apply -f k8s/ingress.yml
          # kubectl rollout status deployment/sre-app -n sre-demo --timeout=120s
          echo "Deploy step ready — add KUBE_CONFIG secret to enable real cluster deployment"
