global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      continue: true
    - match:
        severity: warning
      receiver: default

receivers:
  - name: default
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

# Suppress warning-level alert when a critical one already fired for the same scope
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, job]
