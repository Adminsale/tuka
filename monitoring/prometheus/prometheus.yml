global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster:     'local'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: sre-app
    static_configs:
      - targets: ['sre-app:5000']
    metrics_path: /metrics
    scrape_interval: 10s
