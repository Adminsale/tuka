[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache = true
solc_version = "0.8.23"
evm_version = "paris"
ffi = true
optimizer = true
optimizer_runs = 10000
via_ir = true

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache = false
solc_version = "0.8.23"
evm_version = "paris"
ffi = true
optimizer = true
optimizer_runs = 10000
via_ir = false

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
optimism_sepolia = "${OPTIMISM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}" }
optimism_sepolia = { key = "${OPTIMISCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }
